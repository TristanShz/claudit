# Anthropic API list prices, in USD per million tokens (MTok), compiled into
# claudit (`claudit::pricing::PriceTable::builtin`). Cost is computed from
# token counts at query time, so correcting a price here and rebuilding
# reprices the whole archive without re-ingesting.
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing
#         (redirected from https://docs.claude.com/en/docs/about-claude/pricing),
#         "Model pricing" table, read on 2026-09-29.
# Standard first-party rates only: no batch discount, fast mode, data
# residency (`inference_geo: "us"`, 1.1x) or partner-platform pricing.
#
# Keys are model ids as the API reports them in `message.model`. Lookups
# also strip a `[1m]`-style context suffix, a snapshot date (`-20251001`
# or `@20251001`) and a provider prefix (`us.anthropic.`), then match the id
# or one of its `aliases` exactly: a point release missing here is reported
# as unknown rather than priced as its family.
#
# Token classes: `input` (uncached input), `output`, `cache_write_5m` /
# `cache_write_1h` (prompt-cache writes by TTL) and `cache_read` (hits and
# refreshes). Values must have at most 6 decimals.

version = "2026-09-29"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

# ---- Fable / Mythos ---------------------------------------------------------

[models.claude-fable-5-1]
input = 10.0
output = 50.0
cache_write_5m = 12.50
cache_write_1h = 20.0
cache_read = 0.25

