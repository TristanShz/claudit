name: Release

# Builds binaries for macOS (Apple silicon and Intel), Linux (x86_64 and
# arm64, statically linked against musl so they run on any distribution) and
# Windows (x86_64) for a version tag, and publishes them, with SHA-256
# checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check tag and tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # The Intel binary is cross-compiled on the Apple silicon runner
          # (Xcode's clang targets both, including the bundled SQLite).
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # The archive layout and names are what `claudit update` expects
      # (`src/update.rs`: `archive_name`, `archive_extension`).
      - name: Package
        run: |
          name="claudit-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            cp "../target/${{ matrix.target }}/release/claudit.exe" "${name}/"
            archive="${name}.zip"
            7z a -tzip "${archive}" "${name}"
          else
            cp "../target/${{ matrix.target }}/release/claudit" "${name}/"
            archive="${name}.tar.gz"
            tar -czf "${archive}" "${name}"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: claudit-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
