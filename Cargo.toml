[package]
name = "claudit"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Local analytics for Claude Code sessions: hook capture, SQLite archive, local dashboard"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TristanShz/claudit"
homepage = "https://github.com/TristanShz/claudit"
readme = "README.md"
keywords = ["claude", "claude-code", "analytics", "hooks", "sqlite"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
# Everything the build needs (migrations, templates, assets, price table and
# redaction patterns are compiled in); test fixtures stay in the repository.
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/migrations/*.sql",
    "/templates/**/*.html",
    "/assets/*",
    "/pricing/prices.toml",
    "/activities/rules.toml",
    "/redaction/patterns.toml",
    "/README.md",
    "/ARCHITECTURE.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[lints.clippy]
# rust-version 1.88 (askama's minimum) makes clippy suggest `is_multiple_of`
# in src/pricing.rs. Allowed until that line is updated.
manual_is_multiple_of = "allow"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_urlencoded = "0.7"
toml = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
