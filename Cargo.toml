[package]
name = "claudit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local analytics for Claude Code sessions: hook capture, SQLite archive, local dashboard"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["claude", "claude-code", "analytics", "hooks"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
